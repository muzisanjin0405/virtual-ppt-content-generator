name: Validate and release Skill

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Skill
        shell: pwsh
        run: ./scripts/Test-Skill.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release tag
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath ./VERSION).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match VERSION v$version"
          }

      - name: Build release files
        shell: pwsh
        run: ./scripts/Build-Release.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ./dist/* --generate-notes --verify-tag
