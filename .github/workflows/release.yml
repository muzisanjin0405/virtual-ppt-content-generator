name: Validate and release Skill

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skill-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Skill
        shell: pwsh
        run: ./scripts/Test-Skill.ps1

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version and check existing Release
        id: release_info
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw -LiteralPath ./VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must use semantic version format, for example 2.6.1. Found: $version"
          }

          $tag = "v$version"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"

          try {
            Invoke-RestMethod -Uri $releaseUri -Headers $headers | Out-Null
            $releaseExists = $true
          } catch {
            $statusCode = $null
            if ($null -ne $_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
            if ($statusCode -eq 404) {
              $releaseExists = $false
            } else {
              throw
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_exists=$($releaseExists.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($releaseExists) {
            Write-Host "Release $tag already exists. Validation passed; no new Release is needed."
          } else {
            Write-Host "Release $tag does not exist and will be created."
          }

      - name: Build release files
        if: steps.release_info.outputs.release_exists != 'true'
        shell: pwsh
        run: ./scripts/Build-Release.ps1

      - name: Create version tag when missing
        if: steps.release_info.outputs.release_exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release_info.outputs.tag }}"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $tagUri = "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/$tag"

          try {
            Invoke-RestMethod -Uri $tagUri -Headers $headers | Out-Null
            $tagExists = $true
          } catch {
            $statusCode = $null
            if ($null -ne $_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
            if ($statusCode -eq 404) {
              $tagExists = $false
            } else {
              throw
            }
          }

          if ($tagExists) {
            Write-Host "Tag $tag already exists."
          } else {
            $body = @{
              ref = "refs/tags/$tag"
              sha = "${{ github.sha }}"
            } | ConvertTo-Json
            Invoke-RestMethod `
              -Method Post `
              -Uri "https://api.github.com/repos/${{ github.repository }}/git/refs" `
              -Headers $headers `
              -ContentType "application/json" `
              -Body $body | Out-Null
            Write-Host "Created tag $tag at ${{ github.sha }}."
          }

      - name: Publish GitHub Release
        if: steps.release_info.outputs.release_exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release_info.outputs.tag }}"
          $assets = Get-ChildItem -LiteralPath ./dist -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName }

          if ($assets.Count -ne 4) {
            throw "Expected 4 release assets, found $($assets.Count)."
          }

          gh release create $tag @assets `
            --repo "${{ github.repository }}" `
            --title $tag `
            --generate-notes `
            --verify-tag
