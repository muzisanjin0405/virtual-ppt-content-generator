name: Validate and release Skill

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skill-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Skill
        shell: pwsh
        run: ./scripts/Test-Skill.ps1

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version and check existing Release
        id: release_info
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw -LiteralPath ./VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must use semantic version format, for example 2.6.1. Found: $version"
          }

          $tag = "v$version"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_exists=$($releaseExists.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($releaseExists) {
            Write-Host "Release $tag already exists. Validation passed; no new Release is needed."
          } else {
            Write-Host "Release $tag does not exist and will be created."
          }

      - name: Build release files
        if: steps.release_info.outputs.release_exists != 'true'
        shell: pwsh
        run: ./scripts/Build-Release.ps1

      - name: Create version tag when missing
        if: steps.release_info.outputs.release_exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release_info.outputs.tag }}"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $tag already exists."
          } else {
            gh api --method POST "repos/${{ github.repository }}/git/refs" `
              -f ref="refs/tags/$tag" `
              -f sha="${{ github.sha }}"
            Write-Host "Created tag $tag at ${{ github.sha }}."
          }

      - name: Publish GitHub Release
        if: steps.release_info.outputs.release_exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release_info.outputs.tag }}"
          $assets = Get-ChildItem -LiteralPath ./dist -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName }

          if ($assets.Count -ne 4) {
            throw "Expected 4 release assets, found $($assets.Count)."
          }

          gh release create $tag @assets `
            --repo "${{ github.repository }}" `
            --title $tag `
            --generate-notes `
            --verify-tag
